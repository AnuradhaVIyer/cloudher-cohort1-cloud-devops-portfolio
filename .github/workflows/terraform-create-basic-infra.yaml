name: "Terraform Create Basic Infrastructure v2"

on:
  push:
    branches:
      - main
      - terraform
    paths:
      - "terraform/aws/basic-infra/**"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.11.0"
  TF_WORKING_DIR: terraform/aws/basic-infra
  
jobs:
  terraform:
    name: "Use Terraform to create basic infrastructure"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v3

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Debug OIDC Token Claims
        run: |
          ACTIONS_ID_TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== Decoded JWT Claims ==="
          jq -R 'split(".") | .[1] | @base64d | fromjson' <<< "$ACTIONS_ID_TOKEN"
          
      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: "Terraform Init"
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: "Terraform Format"
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: "Terraform Validate"
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: "Terraform Plan"
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan

      - name: "Terraform Apply"
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve
